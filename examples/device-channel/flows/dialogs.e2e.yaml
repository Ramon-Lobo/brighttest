# Dialogs: open a confirm dialog on the Scene, answer it, check the recorded result.
appId: dev
config: { timeout: 15 }
steps:
  - launch
  - assertVisible: { id: homeScreen }
  - press: { key: Down, count: 2 }             # menu item 2: Dialogs
  - press: Select
  - assertVisible: { id: dialogsScreen }
  - press: Down                                # second button: confirm dialog
  - press: Select
  - assertVisible: { id: deviceDialog }
  - press: Select                              # first dialog button
  - assertGone: { id: deviceDialog }
  - assertState: { path: global.lastdialog, equals: "dialog:0" }
