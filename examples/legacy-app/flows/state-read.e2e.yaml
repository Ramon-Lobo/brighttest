# Reads app state: tierLabel is bound to m.global.user.tier; main.brs seeds registry legacy_prefs.lastTier.
# State steps need an instrumented build (instrument build --net).
appId: dev
config: { timeout: 8 }
steps:
  - launch
  - waitForAgent: { timeout: 30 }
  - assertText: { id: tierLabel, equals: "Tier: free" }
  - assertState: { layer: global, path: user.tier, equals: free }
  - assertState: { layer: registry, path: legacy_prefs.lastTier, equals: free }
