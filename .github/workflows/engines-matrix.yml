name: Engines matrix

# Runs brighttest against each engine flavor it supports, and probes every flavor so the engine
# capability metadata and the RSG coverage baseline cannot drift unnoticed.
#
#   patched-pinned     the exact @ramonlobo/* versions pinned in package.json (what users get)
#   stock-latest       latest published stock brs-node and rooibos-roku (BRIGHTTEST_ENGINES=stock)
#   patched-candidate  a patched build under test, supplied by hand (workflow_dispatch inputs only)
#
# Read-only: no secrets, no publishing, nothing is pushed anywhere. Device lanes never run in CI.
on:
  pull_request:
    paths:
      - "lib/**"
      - "brs/**"
      - "package.json"
      - "package-lock.json"
      - "test/engine-probes/**"
      - ".github/workflows/engines-matrix.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      brs_node_spec:
        description: "Candidate @ramonlobo/brs-node install spec (npm version, dist-tag or tarball path/URL); empty skips the candidate leg"
        required: false
        default: ""
      rooibos_spec:
        description: "Candidate @ramonlobo/rooibos-roku install spec; empty keeps the pinned one"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: engines-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    name: ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [patched-pinned, stock-latest]
    env:
      # patched-pinned uses the stamped @ramonlobo/* builds, stock-latest the unmodified upstream ones.
      BRIGHTTEST_ENGINES: ${{ matrix.flavor == 'stock-latest' && 'stock' || 'patched' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Install stock engines (stock-latest only)
        if: matrix.flavor == 'stock-latest'
        # --no-save keeps package.json and the lockfile untouched; the pinned patched packages stay installed beside them.
        run: npm install --no-save --no-audit --no-fund brs-node@latest rooibos-roku@latest

      - name: Engine versions
        run: |
          {
            echo "### ${{ matrix.flavor }}"
            echo
            echo '```'
            node bin/cli.js doctor --engines | head -3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TP-ENG-11 step 4: the engine-caps probe. Exits non-zero when the probe contradicts the engine's own metadata.
      - name: Engine-caps probe vs metadata
        run: node bin/cli.js doctor --engines

      - name: Unit tests
        run: npm run test:unit

      # Capability-gated tests skip with their reason on stock engines; they must not fail.
      - name: Integration tests
        run: npm run test:integration

      - name: Example apps (default, --coverage, --no-sgnode)
        run: |
          set -euo pipefail
          cli="$GITHUB_WORKSPACE/bin/cli.js"
          scratch="$(mktemp -d)"
          for app in sample-app streaming-app; do
            for mode in default --coverage --no-sgnode; do
              dir="$scratch/$app-$mode"
              cp -R "examples/$app" "$dir"
              echo "::group::$app $mode"
              if [ "$mode" = default ]; then
                (cd "$dir" && timeout 600 node "$cli")
              else
                (cd "$dir" && timeout 600 node "$cli" "$mode")
              fi
              echo "::endgroup::"
            done
          done

      # The RSG coverage probes (API surface and SceneGraph behavior) diffed against the committed baseline.
      # Pinned patched build: any difference fails, so a pin bump has to refresh the baseline in the same change.
      # Other flavors are expected to differ (stock lacks the patches, a candidate may add some): reported, not failed.
      - name: RSG coverage probe vs baseline
        run: |
          set -euo pipefail
          probes="$GITHUB_WORKSPACE/test/engine-probes"
          work="$(mktemp -d)"
          timeout 900 node "$probes/probe-api.js" --install "$GITHUB_WORKSPACE" --out "$work/api.json" --work "$work/api" --jobs 4
          timeout 900 node "$probes/probe-behavior.js" --install "$GITHUB_WORKSPACE" --out "$work/behavior.json" --work "$work/behavior"
          strict=""
          if [ "${{ matrix.flavor }}" = patched-pinned ]; then strict="--strict"; fi
          status=0
          node "$probes/baseline.js" diff "$probes/baseline-patched.txt" "$work/api.json" "$work/behavior.json" $strict | tee "$work/diff.txt" || status=$?
          {
            echo "### RSG probe vs baseline (${{ matrix.flavor }})"
            echo
            echo '```diff'
            head -200 "$work/diff.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  candidate:
    name: patched-candidate
    if: github.event_name == 'workflow_dispatch' && inputs.brs_node_spec != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRIGHTTEST_ENGINES: patched
      BRS_NODE_SPEC: ${{ inputs.brs_node_spec }}
      ROOIBOS_SPEC: ${{ inputs.rooibos_spec }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Install candidate engines
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "@ramonlobo/brs-node@${BRS_NODE_SPEC}"
          if [ -n "$ROOIBOS_SPEC" ]; then
            npm install --no-save --no-audit --no-fund "@ramonlobo/rooibos-roku@${ROOIBOS_SPEC}"
          fi

      - name: Engine-caps probe vs metadata
        run: node bin/cli.js doctor --engines

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: RSG coverage probe vs baseline (reported, not failed)
        run: |
          set -euo pipefail
          probes="$GITHUB_WORKSPACE/test/engine-probes"
          work="$(mktemp -d)"
          timeout 900 node "$probes/probe-api.js" --install "$GITHUB_WORKSPACE" --out "$work/api.json" --work "$work/api" --jobs 4
          timeout 900 node "$probes/probe-behavior.js" --install "$GITHUB_WORKSPACE" --out "$work/behavior.json" --work "$work/behavior"
          node "$probes/baseline.js" diff "$probes/baseline-patched.txt" "$work/api.json" "$work/behavior.json" | tee "$work/diff.txt"
          {
            echo "### RSG probe vs baseline (patched-candidate)"
            echo
            echo '```diff'
            head -200 "$work/diff.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
