name: Deploy Docs

# Builds the VitePress docs site and deploys it to GitHub Pages.
# Enable once in the repo: Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
#
# Only run when something that affects the docs site actually changed. A push to `main` that
# doesn't touch any of these paths skips the workflow entirely (no build, no deploy). Manual
# `workflow_dispatch` runs ignore the paths filter, so you can always force a redeploy.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
    # A release tag always deploys: GitHub does not apply `paths` filters to tag pushes.
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege by default; the two jobs widen this only as far as they each need. In particular
# `id-token: write` is granted to `deploy` alone — `build` runs `npm ci`, which executes install
# lifecycle scripts from the whole dependency tree, and that job has no business being able to mint
# an OIDC token.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # actions/configure-pages reads (and can enable) the Pages config
    steps:
      # Always build from `main` (the build script and `next` live there), even on a tag-triggered run;
      # the tag itself is built from its own worktree. Full history brings every tag and a correct
      # `lastUpdated`.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22" # match `engines.node` (>=22); brs-node crashes on older
          cache: npm
      - uses: actions/configure-pages@v6
      # Install from the committed lockfile so a docs deploy resolves exactly the reviewed
      # dependency versions. This previously ran `npm pkg delete dependencies` followed by
      # `npm install --no-save --no-package-lock`, which skipped the lockfile entirely and
      # re-resolved the whole VitePress tree on every deploy. That workaround existed because
      # the @ramonlobo/* runtime packages were unpublished; both are on npm now, so a plain
      # `npm ci` works and the unpinned install is no longer a tradeoff worth making.
      - name: Install dependencies
        run: npm ci
      - name: Plan versioned docs build
        run: node scripts/docs-site.js plan
      # Builds `next` from main plus each planned release tag in its own worktree (old tags install
      # with `--ignore-scripts`), writes versions.json and the step summary.
      - name: Build docs
        run: node scripts/docs-site.js build --out _site
      # Every release tag must have a matching changelog section (full history above fetched the tags).
      - name: Check changelog against tags
        run: node scripts/changelog.js check --tags
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
