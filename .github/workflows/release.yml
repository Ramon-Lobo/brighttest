name: Release

# Stage-only npm release. Pushing a `v*` tag runs `verify`, which gates the release and builds the tarball (a real
# `npm pack`, uploaded as a 1-day artifact with its sha512 integrity as a job output). `publish` then runs NO repository
# code: it downloads that tarball, checks the integrity with an inline check, and stages exactly that file with
# `npm stage publish <tarball>`. Credential: the environment secret NPM_TOKEN, a granular token limited to "Read and
# Write (Stage only)", set on the stage step alone; `id-token: write` serves provenance and OIDC (npm tries OIDC before
# falling back to the token). Nothing is live until the owner approves the staged version with 2FA on npmjs.com or with
# `npm stage approve <stage-id>`. `github-release` then creates a DRAFT GitHub Release for the owner to publish.
#
# The npm trusted publisher MUST have its environment field set to npm-release (otherwise a copy of this file on
# another branch could mint an OIDC token). The token and the trusted publisher can only stage, and the package
# disallows bypass-2FA tokens, so this file must never call `npm publish`. See docs/maintainers.md, "Releasing".
#
# Rehearsal: Actions -> Release -> Run workflow (dry_run, default true) runs `verify` ONLY (every gate plus a real pack,
# no artifact upload). `publish` and `github-release` run on tag pushes only, so a dispatch never touches the
# npm-release environment, OIDC or the npm token. A dispatch with dry_run=false is refused. The true rehearsal of
# staging is pushing a prerelease tag (for example v0.8.0-rc.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: runs verify only (gates + a pack, no upload). Nothing is staged, published or released. Must stay true."
        type: boolean
        default: true

permissions: {}

# One run per tag; a second push of the same tag queues instead of cancelling a run that may be mid-stage.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Refuse a real run from workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "::error::workflow_dispatch is rehearsal only. Release by pushing a v* tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and every tag, for the ancestor and changelog checks
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check tag, version and branch
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $VERSION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $REF_NAME does not equal v$VERSION (package.json)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::Tagged commit $SHA is not an ancestor of origin/main. Tag a commit that is on main."
              exit 1
            fi
          else
            echo "::notice::Rehearsal: tag and ancestor checks skipped (no tag on this run)."
          fi
          # Fail closed: only a registry 404 means "not published". Any other error stops the run.
          set +e
          VIEW=$(npm view "brighttest@$VERSION" version 2>&1)
          VIEW_RC=$?
          set -e
          if [ "$VIEW_RC" -eq 0 ] && [ -n "$VIEW" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::error::brighttest@$VERSION is already on npm. Versions cannot be reused; bump and tag again."
              exit 1
            fi
            echo "::warning::brighttest@$VERSION is already on npm (fine for a rehearsal, fatal for a tag run)."
          elif printf '%s' "$VIEW" | grep -q 'E404'; then
            echo "brighttest@$VERSION is not on npm yet."
          else
            echo "::error::Could not tell whether brighttest@$VERSION is on npm (not a 404): $VIEW"
            exit 1
          fi
      - name: Check changelog
        run: |
          set -euo pipefail
          npm_package_version=$(node -p "require('./package.json').version") node scripts/changelog.js check --version-env
          node scripts/changelog.js check --tags
      - name: Check dependency ranges resolve on npm (fork packages must be published first)
        run: node scripts/release-check.js deps
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Build Studio, pack the tarball and check its contents
        id: pack
        run: |
          set -euo pipefail
          npm ci --prefix lib/studio/web
          npm --prefix lib/studio/web run build
          # A real pack (not --dry-run: dry-run leaks into nested npm installs). Studio is already built, so skip scripts.
          mkdir -p "$RUNNER_TEMP/out"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/out" > "$RUNNER_TEMP/pack.json"
          node scripts/release-check.js pack "$RUNNER_TEMP/pack.json"
          echo "integrity=$(node scripts/release-check.js integrity "$RUNNER_TEMP/pack.json")" >> "$GITHUB_OUTPUT"
          echo "tarball=$(node scripts/release-check.js filename "$RUNNER_TEMP/pack.json")" >> "$GITHUB_OUTPUT"
      - name: Upload the tarball (the exact bytes that will be staged)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ github.ref_name }}
          path: ${{ runner.temp }}/out/${{ steps.pack.outputs.tarball }}
          retention-days: 1
          if-no-files-found: error
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      tarball: ${{ steps.pack.outputs.tarball }}

  # Runs NO repository code: no checkout, no npm ci, no scripts from the repo. It downloads the tarball verify built,
  # checks its sha512 integrity against verify's output with an inline check, and stages that exact file. A compromised
  # build dependency can therefore not reach the OIDC token or NPM_TOKEN via PATH, .npmrc or the toolcache here; it can
  # still put malicious content into the tarball itself (it runs in verify), which is why the tag/branch protections
  # and the owner's 2FA review of the staged package matter.
  publish:
    name: stage on npm
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write # GitHub OIDC for the npm trusted publisher
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build
      - name: Ensure npm supports staged publishing (>= 11.15.0)
        run: |
          set -euo pipefail
          echo "npm $(npm -v), node $(node -v)"
          if ! node -e 'const [a,b]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm -v)"; then
            # Pinned version, registry integrity compared with a constant before installing (npm has no install scripts).
            WANT="sha512-5Cf+jE+XctbhH/zjOOqXC+ity7eec/Tkk4Ql38tf6w+1htp2wYPHmE4c1R1Es3DY227Ac14+SLrlYJwkBicbTg=="
            [ "$(npm view npm@11.21.3 dist.integrity)" = "$WANT" ]
            npm install -g npm@11.21.3
            echo "npm now $(npm -v)"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball-${{ github.ref_name }}
          path: ${{ runner.temp }}/pkg
      - name: Verify the tarball integrity and work out version and dist-tag
        id: meta
        env:
          EXPECTED: ${{ needs.verify.outputs.integrity }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          REF_NAME: ${{ github.ref_name }}
          PKG_DIR: ${{ runner.temp }}/pkg
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if [ "$TARBALL" != "brighttest-${VERSION}.tgz" ]; then
            echo "::error::Unexpected tarball name $TARBALL for tag $REF_NAME."
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::error::verify did not report a tarball integrity."
            exit 1
          fi
          ACTUAL=$(node -e 'const c=require("crypto"),fs=require("fs");process.stdout.write("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$PKG_DIR/$TARBALL")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tarball integrity differs from the one verify built ($ACTUAL vs $EXPECTED)."
            exit 1
          fi
          case "$VERSION" in
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Stage the package (not live until approved)
        id: stage
        env:
          # The only place the token is exposed. Stage-only scope: a leak can stage, never go live.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          PKG_DIR: ${{ runner.temp }}/pkg
        run: |
          set -euo pipefail
          # Stage the verified tarball itself. npm tries OIDC first, then NODE_AUTH_TOKEN.
          # --tag: prereleases must be staged under `next`, never `latest` (the CLI also errors on a prerelease
          # without an explicit tag). The tag is immutable once staged; to change it, reject and re-stage.
          # --provenance: libnpmpublish signs a statement for the tarball's digest using this run's OIDC identity, so
          # the attestation names this workflow run (not the build job).
          npm stage publish "$PKG_DIR/$TARBALL" --ignore-scripts --access public --tag "$DIST_TAG" --provenance 2>&1 | tee "$RUNNER_TEMP/stage.log"
          # npm prints: + brighttest@X (staged with id <id>)
          STAGE_ID=$(grep -Eo 'staged with id [A-Za-z0-9_-]+' "$RUNNER_TEMP/stage.log" | head -n1 | awk '{print $NF}' || true)
          {
            echo "## brighttest v${VERSION} is STAGED, not published"
            echo
            echo "Dist-tag when approved: \`${DIST_TAG}\`"
            echo
            if [ -n "$STAGE_ID" ]; then
              echo "Stage id: \`${STAGE_ID}\`"
            else
              echo "Stage id: not found in the CLI output below. Find it on npmjs.com (Staged Packages tab) or with \`npm stage list brighttest\`."
            fi
            echo
            echo "To make it live (2FA required, nothing publishes until you do this):"
            echo "1. Open npmjs.com, Staged Packages tab, review brighttest v${VERSION}, click **Approve**; or"
            echo "2. Run \`npm stage approve <stage-id>\` from a logged-in terminal."
            echo
            echo "To discard it: **Reject** on npmjs.com or \`npm stage reject <stage-id>\`. Then publish the draft GitHub Release only after approving."
            echo
            echo "CLI output:"
            echo '```'
            cat "$RUNNER_TEMP/stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: draft GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # Release notes link to in-page anchors and docs paths that do not resolve on a GitHub Release: keep the text only.
          NOTES=$(node scripts/changelog.js notes "$TAG" | sed -E 's/\[([^]]+)\]\((#|\.\/|\.\.\/)[^)]*\)/\1/g')
          {
            if ! printf '%s\n' "$NOTES" | grep -q '^- '; then
              echo "> WARNING: no changelog entries were found for this release; write the notes before publishing."
              echo
            fi
            echo "> DRAFT. The package brighttest ${VERSION} is only STAGED on npm (dist-tag \`${DIST_TAG}\`), not live. Publish this release only after approving the staged package on npm."
            echo
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/notes.md"
          PRE=""
          if [ "$DIST_TAG" = "next" ]; then PRE="--prerelease"; fi
          # Always a draft: the owner reads the notes and clicks Publish. Never a published release.
          gh release create "$TAG" --draft --verify-tag $PRE --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
