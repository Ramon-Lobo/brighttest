name: Release

# Stage-only npm release. Pushing a `v*` tag runs `verify`, then `publish`, which STAGES the package on npm with
# `npm stage publish`. Credential: the environment secret NPM_TOKEN, a granular token limited to "Read and Write
# (Stage only)", set on the stage step alone. `id-token: write` stays for provenance (and OIDC, which npm tries
# before falling back to a token). The package is not live until the owner approves
# the staged version with 2FA on npmjs.com or with `npm stage approve <stage-id>`. `github-release` then creates a
# DRAFT GitHub Release; the owner publishes it after approving the package.
#
# The token and the npm trusted publisher can only stage, and the package disallows bypass-2FA tokens, so this
# file must never call `npm publish`. See docs/maintainers.md, "Releasing".
#
# Rehearsal: Actions -> Release -> Run workflow with dry_run (default true) runs `verify`, then `publish` in
# dry-run form: `npm stage publish --dry-run` WITHOUT the npm token, and no release. It never stages for real and never
# publishes. A dispatch with dry_run=false is refused. What --dry-run checks against the registry is undocumented, so
# staging a real prerelease tag is the true rehearsal.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: run verify only (stage, publish and release are skipped). Must stay true."
        type: boolean
        default: true

permissions: {}

# One run per tag; a second push of the same tag queues instead of cancelling a run that may be mid-stage.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Refuse a real run from workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "::error::workflow_dispatch is rehearsal only. Release by pushing a v* tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and every tag, for the ancestor and changelog checks
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check tag, version and branch
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $VERSION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $REF_NAME does not equal v$VERSION (package.json)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::Tagged commit $SHA is not an ancestor of origin/main. Tag a commit that is on main."
              exit 1
            fi
          else
            echo "::notice::Rehearsal: tag and ancestor checks skipped (no tag on this run)."
          fi
          if npm view "brighttest@$VERSION" version 2>/dev/null | grep -q .; then
            if [ "$EVENT" = "push" ]; then
              echo "::error::brighttest@$VERSION is already on npm. Versions cannot be reused; bump and tag again."
              exit 1
            fi
            echo "::warning::brighttest@$VERSION is already on npm (fine for a rehearsal, fatal for a tag run)."
          fi
      - name: Check changelog
        run: |
          set -euo pipefail
          npm_package_version=$(node -p "require('./package.json').version") node scripts/changelog.js check --version-env
          node scripts/changelog.js check --tags
      - name: Check dependency ranges resolve on npm (fork packages must be published first)
        run: node scripts/release-check.js deps
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Build Studio and check the tarball contents
        run: |
          set -euo pipefail
          # Build first and pack with --ignore-scripts: `npm pack --dry-run` exports dry-run to the nested
          # `npm install` inside prepack, which then installs nothing and the Studio build fails.
          npm run studio:build
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node scripts/release-check.js pack "$RUNNER_TEMP/pack.json"

  publish:
    name: stage on npm
    needs: verify
    if: github.event_name == 'push' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write # GitHub OIDC for the npm trusted publisher
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Ensure npm supports staged publishing (>= 11.15.0)
        run: |
          set -euo pipefail
          echo "npm $(npm -v), node $(node -v)"
          if ! node scripts/release-check.js version-ok "$(npm -v)"; then
            npm install -g npm@11.21.3
            echo "npm now $(npm -v)"
            node scripts/release-check.js version-ok "$(npm -v)"
          fi
      - name: Work out version and dist-tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node scripts/release-check.js dist-tag "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Dry-run stage (rehearsal only; no token, stages nothing)
        if: github.event_name != 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm stage publish --dry-run --access public --tag "$DIST_TAG" --provenance 2>&1 | tee "$RUNNER_TEMP/dry.log" || true
          {
            echo "## Rehearsal: npm stage publish --dry-run for brighttest v${VERSION} (dist-tag \`${DIST_TAG}\`)"
            echo
            echo "Nothing was staged or published. npm does not document which registry or permission checks --dry-run performs, so this only proves the tarball packs. Push a prerelease tag (for example v0.8.0-rc.0) to rehearse a real stage."
            echo
            echo '```'
            cat "$RUNNER_TEMP/dry.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the package (not live until approved)
        if: github.event_name == 'push'
        id: stage
        env:
          # The only place the token is exposed. Stage-only scope: a leak can stage, never go live.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # prepack builds Studio. npm tries OIDC first and falls back to NODE_AUTH_TOKEN (the stage-only token).
          # --tag: prereleases must be staged under `next`, never `latest` (the CLI also errors on a prerelease
          # without an explicit tag). The tag is immutable once staged; to change it, reject and re-stage.
          # --provenance: attach the build provenance attestation (supported by `npm stage publish`).
          npm stage publish --access public --tag "$DIST_TAG" --provenance 2>&1 | tee "$RUNNER_TEMP/stage.log"
          STAGE_ID=$(grep -Eio 'stage[ _-]?id[^A-Za-z0-9]+[A-Za-z0-9_-]+' "$RUNNER_TEMP/stage.log" | head -n1 | grep -Eo '[A-Za-z0-9_-]+$' || true)
          echo "stage_id=${STAGE_ID}" >> "$GITHUB_OUTPUT"
          {
            echo "## brighttest v${VERSION} is STAGED, not published"
            echo
            echo "Dist-tag when approved: \`${DIST_TAG}\`"
            echo
            if [ -n "$STAGE_ID" ]; then
              echo "Stage id: \`${STAGE_ID}\`"
            else
              echo "Stage id: not recognised in the CLI output below. Find it on npmjs.com (Staged Packages tab) or with \`npm stage list brighttest\`."
            fi
            echo
            echo "To make it live (2FA required, nothing publishes until you do this):"
            echo "1. Open npmjs.com, Staged Packages tab, review brighttest v${VERSION}, click **Approve**; or"
            echo "2. Run \`npm stage approve <stage-id>\` from a logged-in terminal."
            echo
            echo "To discard it: **Reject** on npmjs.com or \`npm stage reject <stage-id>\`. Then publish the draft GitHub Release only after approving."
            echo
            echo "CLI output:"
            echo '```'
            cat "$RUNNER_TEMP/stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: draft GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          set -euo pipefail
          {
            echo "> DRAFT. The package brighttest ${VERSION} is only STAGED on npm (dist-tag \`${DIST_TAG}\`), not live. Publish this release only after approving the staged package on npm."
            echo
            node scripts/changelog.js notes "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          PRE=""
          if [ "$DIST_TAG" = "next" ]; then PRE="--prerelease"; fi
          # Always a draft: the owner reads the notes and clicks Publish. Never a published release.
          gh release create "$TAG" --draft --verify-tag $PRE --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
