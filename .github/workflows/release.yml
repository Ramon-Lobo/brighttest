name: Release

# Stage-only npm release. Pushing a `v*` tag runs `verify`, then `publish`, which STAGES the package on npm with
# `npm stage publish`. Credential: the environment secret NPM_TOKEN, a granular token limited to "Read and Write
# (Stage only)", set on the stage step alone. `id-token: write` stays for provenance (and OIDC, which npm tries
# before falling back to a token). The package is not live until the owner approves
# the staged version with 2FA on npmjs.com or with `npm stage approve <stage-id>`. `github-release` then creates a
# DRAFT GitHub Release; the owner publishes it after approving the package.
#
# The npm trusted publisher MUST have its environment field set to npm-release (otherwise a copy of this file on
# another branch could mint an OIDC token). The token and the trusted publisher can only stage, and the package disallows bypass-2FA tokens, so this
# file must never call `npm publish`. See docs/maintainers.md, "Releasing".
#
# Rehearsal: Actions -> Release -> Run workflow (dry_run, default true) runs `verify` ONLY: every gate plus a
# `npm pack --dry-run` of the tarball. `publish` and `github-release` run on tag pushes only, so a dispatch never
# touches the npm-release environment, OIDC or the npm token. A dispatch with dry_run=false is refused. The true
# rehearsal of staging is pushing a prerelease tag (for example v0.8.0-rc.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: runs verify only (gates + npm pack --dry-run). Nothing is staged, published or released. Must stay true."
        type: boolean
        default: true

permissions: {}

# One run per tag; a second push of the same tag queues instead of cancelling a run that may be mid-stage.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Refuse a real run from workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "::error::workflow_dispatch is rehearsal only. Release by pushing a v* tag."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and every tag, for the ancestor and changelog checks
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check tag, version and branch
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $VERSION"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$EVENT" = "push" ]; then
            if [ "$REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $REF_NAME does not equal v$VERSION (package.json)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::Tagged commit $SHA is not an ancestor of origin/main. Tag a commit that is on main."
              exit 1
            fi
          else
            echo "::notice::Rehearsal: tag and ancestor checks skipped (no tag on this run)."
          fi
          # Fail closed: only a registry 404 means "not published". Any other error stops the run.
          set +e
          VIEW=$(npm view "brighttest@$VERSION" version 2>&1)
          VIEW_RC=$?
          set -e
          if [ "$VIEW_RC" -eq 0 ] && [ -n "$VIEW" ]; then
            if [ "$EVENT" = "push" ]; then
              echo "::error::brighttest@$VERSION is already on npm. Versions cannot be reused; bump and tag again."
              exit 1
            fi
            echo "::warning::brighttest@$VERSION is already on npm (fine for a rehearsal, fatal for a tag run)."
          elif printf '%s' "$VIEW" | grep -q 'E404'; then
            echo "brighttest@$VERSION is not on npm yet."
          else
            echo "::error::Could not tell whether brighttest@$VERSION is on npm (not a 404): $VIEW"
            exit 1
          fi
      - name: Check changelog
        run: |
          set -euo pipefail
          npm_package_version=$(node -p "require('./package.json').version") node scripts/changelog.js check --version-env
          node scripts/changelog.js check --tags
      - name: Check dependency ranges resolve on npm (fork packages must be published first)
        run: node scripts/release-check.js deps
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Build Studio and check the tarball contents
        id: pack
        run: |
          set -euo pipefail
          # Build first and pack with --ignore-scripts: `npm pack --dry-run` exports dry-run to the nested
          # `npm install` inside prepack, which then installs nothing and the Studio build fails.
          npm ci --prefix lib/studio/web
          npm --prefix lib/studio/web run build
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node scripts/release-check.js pack "$RUNNER_TEMP/pack.json"
          echo "file_hash=$(node scripts/release-check.js pack-hash "$RUNNER_TEMP/pack.json")" >> "$GITHUB_OUTPUT"
    outputs:
      file_hash: ${{ steps.pack.outputs.file_hash }}

  publish:
    name: stage on npm
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write # GitHub OIDC for the npm trusted publisher
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Ensure npm supports staged publishing (>= 11.15.0)
        run: |
          set -euo pipefail
          echo "npm $(npm -v), node $(node -v)"
          if ! node scripts/release-check.js version-ok "$(npm -v)"; then
            npm install -g npm@11.21.3
            echo "npm now $(npm -v)"
            node scripts/release-check.js version-ok "$(npm -v)"
          fi
      - name: Work out version and dist-tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node scripts/release-check.js dist-tag "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
      # Everything that runs third-party build code happens here, with no npm token and with the OIDC request
      # variables removed, so the credentialed step below runs no lifecycle script and no build.
      - name: Build Studio, check changelog and tarball (no credentials)
        env:
          VERIFIED_HASH: ${{ needs.verify.outputs.file_hash }}
        run: |
          set -euo pipefail
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          npm_package_version=$(node -p "require('./package.json').version") node scripts/changelog.js check --version-env
          npm ci --prefix lib/studio/web
          npm --prefix lib/studio/web run build
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          node scripts/release-check.js pack "$RUNNER_TEMP/pack.json"
          # The tarball staged below is built here, not downloaded from verify; assert it has the same file list.
          HASH=$(node scripts/release-check.js pack-hash "$RUNNER_TEMP/pack.json")
          if [ -z "$VERIFIED_HASH" ] || [ "$HASH" != "$VERIFIED_HASH" ]; then
            echo "::error::Staged file list differs from the one verify tested ($HASH vs $VERIFIED_HASH)."
            exit 1
          fi
      - name: Stage the package (not live until approved)
        id: stage
        env:
          # The only place the token is exposed. Stage-only scope: a leak can stage, never go live.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          set -euo pipefail
          # --ignore-scripts: no lifecycle script runs while the credentials are in the environment (Studio was
          # built and the changelog checked in the previous step). npm tries OIDC first, then NODE_AUTH_TOKEN.
          # --tag: prereleases must be staged under `next`, never `latest` (the CLI also errors on a prerelease
          # without an explicit tag). The tag is immutable once staged; to change it, reject and re-stage.
          # --provenance: attach the build provenance attestation (supported by `npm stage publish`).
          npm stage publish --ignore-scripts --access public --tag "$DIST_TAG" --provenance 2>&1 | tee "$RUNNER_TEMP/stage.log"
          # npm prints: + brighttest@X (staged with id <id>)
          STAGE_ID=$(node scripts/release-check.js stage-id "$RUNNER_TEMP/stage.log" || true)
          {
            echo "## brighttest v${VERSION} is STAGED, not published"
            echo
            echo "Dist-tag when approved: \`${DIST_TAG}\`"
            echo
            if [ -n "$STAGE_ID" ]; then
              echo "Stage id: \`${STAGE_ID}\`"
            else
              echo "Stage id: not found in the CLI output below. Find it on npmjs.com (Staged Packages tab) or with \`npm stage list brighttest\`."
            fi
            echo
            echo "To make it live (2FA required, nothing publishes until you do this):"
            echo "1. Open npmjs.com, Staged Packages tab, review brighttest v${VERSION}, click **Approve**; or"
            echo "2. Run \`npm stage approve <stage-id>\` from a logged-in terminal."
            echo
            echo "To discard it: **Reject** on npmjs.com or \`npm stage reject <stage-id>\`. Then publish the draft GitHub Release only after approving."
            echo
            echo "CLI output:"
            echo '```'
            cat "$RUNNER_TEMP/stage.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: draft GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          set -euo pipefail
          NOTES=$(node scripts/changelog.js notes "$TAG")
          {
            if ! printf '%s\n' "$NOTES" | grep -q '^- '; then
              echo "> WARNING: no changelog entries were found for this release; write the notes before publishing."
              echo
            fi
            echo "> DRAFT. The package brighttest ${VERSION} is only STAGED on npm (dist-tag \`${DIST_TAG}\`), not live. Publish this release only after approving the staged package on npm."
            echo
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/notes.md"
          PRE=""
          if [ "$DIST_TAG" = "next" ]; then PRE="--prerelease"; fi
          # Always a draft: the owner reads the notes and clicks Publish. Never a published release.
          gh release create "$TAG" --draft --verify-tag $PRE --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
