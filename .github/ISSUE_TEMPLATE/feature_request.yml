name: Feature request
description: Suggest an idea or improvement for brighttest
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case. What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A flag, a config option, new behaviour?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using now, or other approaches you thought about.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Headless
        - Headless + coverage
        - Device
        - Cross-check
        - End-to-end (e2e)
        - Studio
        - Instrument
        - Net (hub, mocks)
        - Assess / features
        - MCP
        - Skills
        - Device lease
        - CLI / config
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Before filing
      options:
        - label: I removed names of companies, clients and apps, hosts, IPs, tokens, passwords, serials and personal paths.
          required: true
